<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-label="VI-SCAN | Architecture and report-generation flows"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#137D85"/></marker></defs><rect width="1440" height="1050" fill="#F5F8FA"/><text x="44" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="600" fill="#172D42">VI-SCAN | Architecture and report-generation flows</text><text x="44" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Logical components above; numbered execution paths below. Synthetic-data proof of concept - no imaging diagnosis or clinical signing.</text><text x="44" y="123" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#536779">BROWSER</text><text x="430" y="123" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#536779">FASTAPI - ONE INSTANCE</text><text x="860" y="123" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#536779">ADAPTERS</text><text x="1040" y="123" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#536779">DATA / HOSTED MODELS</text><rect x="44" y="155" width="310" height="105" rx="9" fill="#FFFFFF" stroke="#D3DEE5" stroke-width="1"/><text x="60" y="182" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#172D42">Input capture</text><text x="60" y="206" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">AudioWorklet: 16 kHz mono PCM</text><text x="60" y="226" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">Typed input bypasses STT</text><text x="60" y="246" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">Final transcript -&gt; HTTP command</text><rect x="44" y="325" width="310" height="105" rx="9" fill="#FFFFFF" stroke="#D3DEE5" stroke-width="1"/><text x="60" y="352" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#172D42">Clinical workspace</text><text x="60" y="376" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">Patient / report / evidence / chat</text><text x="60" y="396" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">Editable draft JSON; explicit save</text><text x="60" y="416" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">Fixture mode: same rules, no cloud</text><rect x="44" y="535" width="310" height="85" rx="9" fill="#FFFFFF" stroke="#D3DEE5" stroke-width="1"/><text x="60" y="562" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#172D42">Speech playback</text><text x="60" y="586" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">Text first; separate speech request</text><text x="60" y="606" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">Cloud fail: browser voice or text</text><rect x="430" y="155" width="400" height="80" rx="9" fill="#FFFFFF" stroke="#D3DEE5" stroke-width="1"/><text x="446" y="182" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#172D42">HTTP / WebSocket boundary</text><text x="446" y="206" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">Cookie ownership; input/context checks</text><text x="446" y="226" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">WS transcribes; HTTP executes commands</text><rect x="430" y="275" width="400" height="90" rx="9" fill="#FFFFFF" stroke="#137D85" stroke-width="2"/><text x="446" y="302" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#137D85">Typed Python orchestration</text><text x="446" y="326" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">Local acknowledgement / pending reply</text><text x="446" y="346" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">Otherwise: typed LLM plan or extraction</text><rect x="430" y="405" width="400" height="90" rx="9" fill="#FFFFFF" stroke="#137D85" stroke-width="2"/><text x="446" y="432" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#137D85">Business rules + operations</text><text x="446" y="456" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">Identity / modality scope; validate_findings</text><text x="446" y="476" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">Quote, site, negation, uncertainty, versions</text><rect x="430" y="535" width="400" height="85" rx="9" fill="#FFFFFF" stroke="#D3DEE5" stroke-width="1"/><text x="446" y="562" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#172D42">Evidence + response rendering</text><text x="446" y="586" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">Cited answer / editable draft JSON</text><text x="446" y="606" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">Saved turn -&gt; separate POST /speech</text><rect x="1040" y="155" width="356" height="80" rx="9" fill="#FFFFFF" stroke="#D3DEE5" stroke-width="1"/><text x="1056" y="182" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#172D42">Google streaming STT</text><text x="1056" y="206" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">Partial / final transcript events</text><text x="1056" y="226" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">Fallback: Groq file STT</text><rect x="1040" y="275" width="356" height="90" rx="9" fill="#FFFFFF" stroke="#D3DEE5" stroke-width="1"/><text x="1056" y="302" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#172D42">Groq GPT-OSS 120B</text><text x="1056" y="326" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">plan_assistant_action / extraction</text><text x="1056" y="346" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">Grounded answer; untrusted output</text><rect x="1040" y="405" width="356" height="90" rx="9" fill="#FFFFFF" stroke="#D3DEE5" stroke-width="1"/><text x="1056" y="432" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#172D42">SQLite + SQLAlchemy</text><text x="1056" y="456" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">Patients, reports, sessions, drafts, audit</text><text x="1056" y="476" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">Alembic; versioned draft revisions</text><rect x="1040" y="535" width="356" height="85" rx="9" fill="#FFFFFF" stroke="#D3DEE5" stroke-width="1"/><text x="1056" y="562" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#172D42">Groq Orpheus TTS</text><text x="1056" y="586" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">Saved reply or labeled overview</text><text x="1056" y="606" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">Cloud fallback: Google TTS</text><rect x="860" y="171" width="140" height="48" rx="7" fill="#E9F3F2" stroke="#137D85"/><text x="873" y="200" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#137D85">STT adapter</text><rect x="860" y="296" width="140" height="48" rx="7" fill="#E9F3F2" stroke="#137D85"/><text x="873" y="325" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#137D85">LLM adapter</text><rect x="860" y="554" width="140" height="48" rx="7" fill="#E9F3F2" stroke="#137D85"/><text x="873" y="583" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#137D85">TTS adapter</text><path d="M830,195 L860,195" fill="none" stroke="#137D85" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M1000,195 L1040,195" fill="none" stroke="#137D85" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M830,320 L860,320" fill="none" stroke="#137D85" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M1000,320 L1040,320" fill="none" stroke="#137D85" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M830,578 L860,578" fill="none" stroke="#137D85" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M1000,578 L1040,578" fill="none" stroke="#137D85" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M354,205 L430,195" fill="none" stroke="#137D85" stroke-width="2" marker-end="url(#arrow)"/><text x="380.0" y="192.0" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#536779">PCM / WS</text><path d="M354,377 L430,320" fill="none" stroke="#137D85" stroke-width="2" marker-end="url(#arrow)"/><text x="380.0" y="340.5" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#536779">HTTP</text><path d="M630,235 L630,275" fill="none" stroke="#137D85" stroke-width="2" marker-end="url(#arrow)"/><path d="M630,365 L630,405" fill="none" stroke="#137D85" stroke-width="2" marker-end="url(#arrow)"/><path d="M630,495 L630,535" fill="none" stroke="#137D85" stroke-width="2" marker-end="url(#arrow)"/><path d="M830,450 L1040,450" fill="none" stroke="#137D85" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="923.0" y="442.0" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#536779">SQLAlchemy</text><path d="M430,570 L390,570 L390,405 L354,405" stroke="#137D85" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M430,601 L405,601 L405,588 L354,588" stroke="#137D85" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="44" y="655" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#172D42">LLM interprets and selects evidence; Python resolves identity, queries records and checks draft evidence and qualifiers before saving.</text><text x="44" y="680" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">All cloud links pass through adapters for timeouts, retries and fallback. Keys stay server-side. Exact replies / pure thanks can stay local.</text><rect x="44" y="705" width="1352" height="82" rx="8" fill="#FFFFFF" stroke="#D3DEE5"/><text x="60" y="732" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#137D85">RETRIEVAL</text><text x="60" y="763" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">1 Voice: STT / typed text -&gt; 2 HTTP command -&gt; 3 retrieve plan -&gt; 4 identity + ambiguity rules -&gt; 5 latest-report SQL -&gt; 6 report + source</text><rect x="44" y="800" width="1352" height="82" rx="8" fill="#FFFFFF" stroke="#D3DEE5"/><text x="60" y="827" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#137D85">DICTATION TO DRAFT</text><text x="60" y="858" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">1 Transcript -&gt; 2 LLM extraction -&gt; 3 validate_findings (quotes, site, negation, uncertainty) -&gt; 4 editable JSON -&gt; 5 clinician review -&gt; 6 versioned save</text><rect x="44" y="895" width="1352" height="82" rx="8" fill="#FFFFFF" stroke="#D3DEE5"/><text x="60" y="922" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#137D85">CONTEXTUAL FOLLOW-UP</text><text x="60" y="953" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#536779">1 Question -&gt; 2 session patient / report scope -&gt; 3 grounded LLM evidence -&gt; 4 quote / version checks -&gt; 5 answer + source excerpt -&gt; optional TTS</text><text x="44" y="1026" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#536779">283 local tests | Synthetic data only | One worker; hosted inference | Historical voice evidence; current quota not guaranteed</text></svg>