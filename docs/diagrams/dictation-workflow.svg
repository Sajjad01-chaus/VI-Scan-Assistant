<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-label="Clinical dictation to reviewed draft"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#137D85"/></marker></defs><rect width="1440" height="1050" fill="#F5F8FA"/><text x="44" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="600" fill="#172D42">Clinical dictation to reviewed draft</text><text x="44" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Mandatory workflow B. Human review remains explicit at every save.</text><rect x="44" y="160" width="400" height="150" rx="10" fill="#FFFFFF" stroke="#137D85" stroke-width="2"/><text x="64" y="192" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#137D85">1. Capture observations</text><text x="64" y="221" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Audio or typed transcript</text><text x="64" y="246" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Partials display; finalized utterance commits</text><rect x="520" y="160" width="400" height="150" rx="10" fill="#FFFFFF" stroke="#137D85" stroke-width="2"/><text x="540" y="192" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#137D85">2. Extract a structured draft</text><text x="540" y="221" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Groq GPT-OSS 120B + strict schema</text><text x="540" y="246" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Findings, anatomy, polarity, certainty</text><rect x="996" y="160" width="400" height="150" rx="10" fill="#FFFFFF" stroke="#137D85" stroke-width="2"/><text x="1016" y="192" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#137D85">3. Validate evidence</text><text x="1016" y="221" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Source-local anatomy and polarity</text><text x="1016" y="246" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Reject unsupported or conflicting content</text><rect x="44" y="470" width="400" height="150" rx="10" fill="#FFFFFF" stroke="#137D85" stroke-width="2"/><text x="64" y="502" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#137D85">4. Render an editable draft</text><text x="64" y="531" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Readable text from validated fields</text><text x="64" y="556" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">No invented tooth numbering or diagnosis</text><rect x="520" y="470" width="400" height="150" rx="10" fill="#FFFFFF" stroke="#137D85" stroke-width="2"/><text x="540" y="502" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#137D85">5. Clinician edits and reviews</text><text x="540" y="531" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Keep source transcript and revisions</text><text x="540" y="556" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Export validates edits; final save is separate</text><rect x="996" y="470" width="400" height="150" rx="10" fill="#FFFFFF" stroke="#137D85" stroke-width="2"/><text x="1016" y="502" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#137D85">6. Save explicitly as draft</text><text x="1016" y="531" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Require a selected synthetic patient</text><text x="1016" y="556" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Clinician review flag remains true</text><path d="M444,235 L520,235" fill="none" stroke="#137D85" stroke-width="2" marker-end="url(#arrow)"/><path d="M920,235 L996,235" fill="none" stroke="#137D85" stroke-width="2" marker-end="url(#arrow)"/><path d="M1196,310 L1196,385 L244,385 L244,470" stroke="#137D85" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M444,545 L520,545" fill="none" stroke="#137D85" stroke-width="2" marker-end="url(#arrow)"/><path d="M920,545 L996,545" fill="none" stroke="#137D85" stroke-width="2" marker-end="url(#arrow)"/><rect x="44" y="730" width="650" height="170" rx="10" fill="#FFFFFF" stroke="#D3DEE5" stroke-width="1"/><text x="64" y="762" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#172D42">Preserve clinical meaning</text><text x="64" y="791" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Possible remains uncertain; no definite is not certain absence.</text><text x="64" y="816" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Retain negation and correction markers.</text><text x="64" y="841" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Unresolved site conflicts trigger clarification.</text><rect x="746" y="730" width="650" height="170" rx="10" fill="#FFFFFF" stroke="#D3DEE5" stroke-width="1"/><text x="766" y="762" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#172D42">Provenance does not prove entailment</text><text x="766" y="791" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Verbatim evidence is necessary, not sufficient.</text><text x="766" y="816" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Use conservative rules and dedicated semantic tests.</text><text x="766" y="841" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Never present a draft as a signed clinical report.</text><text x="44" y="1026" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#536779">283 local tests | Synthetic data only | One worker; hosted inference | Historical voice evidence; current quota not guaranteed</text></svg>