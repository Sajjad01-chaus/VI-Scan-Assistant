<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-label="Retrieval and contextual follow-up"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#137D85"/></marker></defs><rect width="1440" height="1050" fill="#F5F8FA"/><text x="44" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="600" fill="#172D42">Retrieval and contextual follow-up</text><text x="44" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Mandatory workflows A and C, plus report-aware questions.</text><rect x="44" y="160" width="400" height="150" rx="10" fill="#FFFFFF" stroke="#137D85" stroke-width="2"/><text x="64" y="192" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#137D85">1. Understand the request</text><text x="64" y="221" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Final transcript or typed command</text><text x="64" y="246" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Extract patient name + report modality</text><rect x="520" y="160" width="400" height="150" rx="10" fill="#FFFFFF" stroke="#137D85" stroke-width="2"/><text x="540" y="192" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#137D85">2. Resolve identity</text><text x="540" y="221" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Zero matches: retain request for correction</text><text x="540" y="246" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Approximate or multiple: ask to confirm</text><rect x="996" y="160" width="400" height="150" rx="10" fill="#FFFFFF" stroke="#137D85" stroke-width="2"/><text x="1016" y="192" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#137D85">3. Validate the selection</text><text x="1016" y="221" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Natural replies: explicit directory identity</text><text x="1016" y="246" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Reject ambiguous names and stale context</text><rect x="44" y="470" width="400" height="150" rx="10" fill="#FFFFFF" stroke="#137D85" stroke-width="2"/><text x="64" y="502" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#137D85">4. Retrieve the correct report</text><text x="64" y="531" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Patient scope + requested modality</text><text x="64" y="556" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Latest date selected deterministically</text><rect x="520" y="470" width="400" height="150" rx="10" fill="#FFFFFF" stroke="#137D85" stroke-width="2"/><text x="540" y="502" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#137D85">5. Save explicit context</text><text x="540" y="531" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Selected patient + report ID/version</text><text x="540" y="556" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Show source, report date and modality</text><rect x="996" y="470" width="400" height="150" rx="10" fill="#FFFFFF" stroke="#137D85" stroke-width="2"/><text x="1016" y="502" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#137D85">6. Answer a follow-up</text><text x="1016" y="531" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Named or pronoun context; source checks</text><text x="1016" y="556" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Explicit all reports: separate cited summaries</text><path d="M444,235 L520,235" fill="none" stroke="#137D85" stroke-width="2" marker-end="url(#arrow)"/><path d="M920,235 L996,235" fill="none" stroke="#137D85" stroke-width="2" marker-end="url(#arrow)"/><path d="M1196,310 L1196,385 L244,385 L244,470" stroke="#137D85" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M444,545 L520,545" fill="none" stroke="#137D85" stroke-width="2" marker-end="url(#arrow)"/><path d="M920,545 L996,545" fill="none" stroke="#137D85" stroke-width="2" marker-end="url(#arrow)"/><rect x="44" y="730" width="650" height="170" rx="10" fill="#FFFFFF" stroke="#D3DEE5" stroke-width="1"/><text x="64" y="762" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#172D42">Ambiguity is an application state</text><text x="64" y="791" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Two Priyas never resolve by similarity score alone.</text><text x="64" y="816" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Suspend pronoun follow-ups during an unresolved switch.</text><text x="64" y="841" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">No matching modality: clear active report and explain.</text><rect x="746" y="730" width="650" height="170" rx="10" fill="#FFFFFF" stroke="#D3DEE5" stroke-width="1"/><text x="766" y="762" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#172D42">Evidence remains inspectable</text><text x="766" y="791" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Report IDs/versions and quotes remain inspectable.</text><text x="766" y="816" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Collection failures are labeled; selection is unchanged.</text><text x="766" y="841" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">History restores old results; new UUIDs create new turns.</text><text x="44" y="1026" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#536779">283 local tests | Synthetic data only | One worker; hosted inference | Historical voice evidence; current quota not guaranteed</text></svg>