<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-label="Voice lifecycle and fallback"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#137D85"/></marker></defs><rect width="1440" height="1050" fill="#F5F8FA"/><text x="44" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="600" fill="#172D42">Voice lifecycle and fallback</text><text x="44" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">One logical utterance, one committed command. Text is available before speech playback.</text><rect x="44" y="170" width="250" height="155" rx="10" fill="#FFFFFF" stroke="#137D85" stroke-width="2"/><text x="64" y="202" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#137D85">Capture</text><text x="64" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Browser microphone</text><text x="64" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">PCM over WebSocket</text><path d="M294,247 L320,247" fill="none" stroke="#137D85" stroke-width="2" marker-end="url(#arrow)"/><rect x="320" y="170" width="250" height="155" rx="10" fill="#FFFFFF" stroke="#137D85" stroke-width="2"/><text x="340" y="202" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#137D85">Transcribe</text><text x="340" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Google live STT</text><text x="340" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Partials to UI only</text><path d="M570,247 L596,247" fill="none" stroke="#137D85" stroke-width="2" marker-end="url(#arrow)"/><rect x="596" y="170" width="250" height="155" rx="10" fill="#FFFFFF" stroke="#137D85" stroke-width="2"/><text x="616" y="202" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#137D85">Commit</text><text x="616" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Pause / timer / manual stop</text><text x="616" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">HTTP command + UUID</text><path d="M846,247 L872,247" fill="none" stroke="#137D85" stroke-width="2" marker-end="url(#arrow)"/><rect x="872" y="170" width="250" height="155" rx="10" fill="#FFFFFF" stroke="#137D85" stroke-width="2"/><text x="892" y="202" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#137D85">Interpret + tools</text><text x="892" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Groq LLM + rules</text><text x="892" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Authorized tool result</text><path d="M1122,247 L1148,247" fill="none" stroke="#137D85" stroke-width="2" marker-end="url(#arrow)"/><rect x="1148" y="170" width="250" height="155" rx="10" fill="#FFFFFF" stroke="#137D85" stroke-width="2"/><text x="1168" y="202" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#137D85">Respond</text><text x="1168" y="231" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Text + evidence first</text><text x="1168" y="256" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Then Groq Orpheus</text><rect x="44" y="460" width="650" height="190" rx="10" fill="#FFFFFF" stroke="#D3DEE5" stroke-width="1"/><text x="64" y="492" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#172D42">STT failure before commit</text><text x="64" y="521" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Keep a bounded in-memory utterance buffer.</text><text x="64" y="546" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Submit it once to Groq Whisper Large v3.</text><text x="64" y="571" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">After commit: never replay the same tool action.</text><text x="64" y="596" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">No silent substitution of fixture responses.</text><rect x="746" y="460" width="650" height="190" rx="10" fill="#FFFFFF" stroke="#D3DEE5" stroke-width="1"/><text x="766" y="492" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#172D42">Speech playback and interruption</text><text x="766" y="521" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Interrupt stops playback and invalidates stale audio.</text><text x="766" y="546" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Speak short approved response text only.</text><text x="766" y="571" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Groq -&gt; Google -&gt; disclosed browser voice or text.</text><text x="766" y="596" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Human microphone and audibility remain unverified.</text><rect x="44" y="760" width="1352" height="150" rx="10" fill="#FFFFFF" stroke="#D3DEE5" stroke-width="1"/><text x="64" y="792" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#172D42">What the experiments actually measured</text><text x="64" y="821" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Google live STT: first partial 0.76-1.27 s; final 0.37-0.46 s after last audio chunk.</text><text x="64" y="846" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">Groq 120B extraction: median 0.95 s. Orpheus full audio: median 1.71 s.</text><text x="64" y="871" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#536779">These are different small-sample measurements, not an end-to-end latency promise.</text><text x="44" y="1026" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#536779">293 local tests | Synthetic data only | One worker; hosted inference | Historical voice evidence; current quota not guaranteed</text></svg>